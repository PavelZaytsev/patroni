scope: demo
name: patroni2

restapi:
  listen: 0.0.0.0:8008
  connect_address: patroni2:8008
  authentication:
    username: admin
    password: admin

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
      pg_hba:
      - host replication replicator 0.0.0.0/0 md5
      - host all all 0.0.0.0/0 md5
      parameters:
        # PostgreSQL 17 configuration for logical replication
        wal_level: logical
        max_replication_slots: 10
        max_wal_senders: 10
        sync_replication_slots: 'on'
        hot_standby_feedback: 'on'
        wal_keep_size: '1GB'
        listen_addresses: '*'
        port: 5432

  initdb:
  - encoding: UTF8
  - data-checksums

postgresql:
  listen: 0.0.0.0:5432
  connect_address: patroni2:5432
  data_dir: /home/postgres/data
  bin_dir: /usr/lib/postgresql/17/bin
  authentication:
    replication:
      username: replicator
      password: replicate
    superuser:
      username: postgres
      password: postgres
    rewind:
      username: postgres
      password: postgres
  parameters:
    unix_socket_directories: '/tmp'

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false 